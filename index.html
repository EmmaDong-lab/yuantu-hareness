<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>源图 Hareness 0822</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f5f5;
      padding: 40px 20px;
      color: #333;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 28px;
      font-weight: 600;
    }
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .image-card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .image-card img {
      width: 100%;
      height: auto;
      display: block;
    }
    .image-title {
      padding: 16px 20px;
      font-size: 16px;
      font-weight: 500;
      color: #555;
      border-top: 1px solid #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>源图 Hareness 0822</h1>
    <div class="gallery">
      <div class="image-card">
        <img src="0.功能架构说明.png" alt="功能架构说明">
        <div class="image-title">0. 功能架构说明</div>
      </div>
      <div class="image-card">
        <img src="1.登录页.png" alt="登录页">
        <div class="image-title">1. 登录页</div>
      </div>
      <div class="image-card">
        <img src="2.源图 AI 工作台主页.png" alt="源图 AI 工作台主页">
        <div class="image-title">2. 源图 AI 工作台主页</div>
      </div>
      <div class="image-card">
        <img src="3.对话-调用工作流.png" alt="对话-调用工作流">
        <div class="image-title">3. 对话-调用工作流</div>
      </div>
      <div class="image-card">
        <img src="4.源图能力中心.png" alt="源图能力中心">
        <div class="image-title">4. 源图能力中心</div>
      </div>
      <div class="image-card">
        <img src="5.项目管理.png" alt="项目管理">
        <div class="image-title">5. 项目管理</div>
      </div>
      <div class="image-card">
        <img src="6.图谱浏览器.png" alt="图谱浏览器">
        <div class="image-title">6. 图谱浏览器</div>
      </div>
      <div class="image-card">
        <img src="7.自动化任务.png" alt="自动化任务">
        <div class="image-title">7. 自动化任务</div>
      </div>
    </div>
  </div>
</body>
</html>
