<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>源图 hareness</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #f8f5ff 0%, #ffffff 100%);
      padding: 40px 20px;
      color: #333;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      margin-bottom: 50px;
      font-size: 32px;
      font-weight: 600;
      color: #5a4fcf;
      letter-spacing: 1px;
    }
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 50px;
    }
    .image-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(90, 79, 207, 0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .image-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 30px rgba(90, 79, 207, 0.15);
    }
    .image-title {
      padding: 20px 24px 12px;
      font-size: 18px;
      font-weight: 600;
      color: #444;
    }
    .image-wrapper {
      padding: 0 24px 24px;
      cursor: zoom-in;
    }
    .image-wrapper img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 8px;
    }

    /* Lightbox */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.92);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    .lightbox.active {
      display: flex;
    }
    .lightbox img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
      transform-origin: center center;
      transition: transform 0.1s ease;
      cursor: grab;
      user-select: none;
    }
    .lightbox img.grabbing {
      cursor: grabbing;
    }
    .lightbox-close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: #fff;
      font-size: 36px;
      cursor: pointer;
      z-index: 1001;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
    }
    .lightbox-close:hover {
      background: rgba(255,255,255,0.2);
    }
    .lightbox-hint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>源图 hareness</h1>
    <div class="gallery">
      <div class="image-card">
        <div class="image-title">0. 功能架构说明</div>
        <div class="image-wrapper" onclick="openLightbox('0.功能架构说明.png')">
          <img src="0.功能架构说明.png" alt="功能架构说明">
        </div>
      </div>
      <div class="image-card">
        <div class="image-title">1. 登录页</div>
        <div class="image-wrapper" onclick="openLightbox('1.登录页.png')">
          <img src="1.登录页.png" alt="登录页">
        </div>
      </div>
      <div class="image-card">
        <div class="image-title">2. 源图 AI 工作台主页</div>
        <div class="image-wrapper" onclick="openLightbox('2.源图 AI 工作台主页.png')">
          <img src="2.源图 AI 工作台主页.png" alt="源图 AI 工作台主页">
        </div>
      </div>
      <div class="image-card">
        <div class="image-title">3. 对话-调用工作流</div>
        <div class="image-wrapper" onclick="openLightbox('3.对话-调用工作流.png')">
          <img src="3.对话-调用工作流.png" alt="对话-调用工作流">
        </div>
      </div>
      <div class="image-card">
        <div class="image-title">4. 源图能力中心</div>
        <div class="image-wrapper" onclick="openLightbox('4.源图能力中心.png')">
          <img src="4.源图能力中心.png" alt="源图能力中心">
        </div>
      </div>
      <div class="image-card">
        <div class="image-title">5. 项目管理</div>
        <div class="image-wrapper" onclick="openLightbox('5.项目管理.png')">
          <img src="5.项目管理.png" alt="项目管理">
        </div>
      </div>
      <div class="image-card">
        <div class="image-title">6. 图谱浏览器</div>
        <div class="image-wrapper" onclick="openLightbox('6.图谱浏览器.png')">
          <img src="6.图谱浏览器.png" alt="图谱浏览器">
        </div>
      </div>
      <div class="image-card">
        <div class="image-title">7. 自动化任务</div>
        <div class="image-wrapper" onclick="openLightbox('7.自动化任务.png')">
          <img src="7.自动化任务.png" alt="自动化任务">
        </div>
      </div>
    </div>
  </div>

  <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
    <div class="lightbox-close">&times;</div>
    <img id="lightbox-img" src="" alt="">
    <div class="lightbox-hint">滚轮缩放 · 拖拽移动 · 点击空白关闭</div>
  </div>

  <script>
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightbox-img');

    let scale = 1;
    let translateX = 0;
    let translateY = 0;
    let isDragging = false;
    let startX, startY;

    function openLightbox(src) {
      lightboxImg.src = src;
      lightbox.classList.add('active');
      resetTransform();
      document.body.style.overflow = 'hidden';
    }

    function closeLightbox(event) {
      if (event.target === lightbox || event.target.classList.contains('lightbox-close')) {
        lightbox.classList.remove('active');
        lightboxImg.src = '';
        document.body.style.overflow = '';
      }
    }

    function resetTransform() {
      scale = 1;
      translateX = 0;
      translateY = 0;
      updateTransform();
    }

    function updateTransform() {
      lightboxImg.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    }

    lightboxImg.addEventListener('wheel', function(e) {
      e.preventDefault();
      const delta = e.deltaY > 0 ? 0.9 : 1.1;
      scale = Math.min(Math.max(0.5, scale * delta), 5);
      updateTransform();
    });

    lightboxImg.addEventListener('mousedown', function(e) {
      e.preventDefault();
      isDragging = true;
      lightboxImg.classList.add('grabbing');
      startX = e.clientX - translateX;
      startY = e.clientY - translateY;
    });

    document.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      translateX = e.clientX - startX;
      translateY = e.clientY - startY;
      updateTransform();
    });

    document.addEventListener('mouseup', function() {
      isDragging = false;
      lightboxImg.classList.remove('grabbing');
    });

    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        lightbox.classList.remove('active');
        lightboxImg.src = '';
        document.body.style.overflow = '';
      }
    });
  </script>
</body>
</html>
